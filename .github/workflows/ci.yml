
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install dependencies
        run: |
          python3 -m pip install --break-system-packages -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: python3 -m ruff check src/ tests/

      - name: Pytest
        run: python3 -m pytest -v tests/

  build-scan-push:
    name: Build Scan and Push
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build Docker image
        run: |
          docker build -t ai381-ci-image:${{ github.sha }} .

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.66.0 image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            ai381-ci-image:${{ github.sha }}

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Tag and push image
        run: |
          IMAGE="ghcr.io/ismaeel-20/ai381-mlops-lab2"
          docker tag ai381-ci-image:${{ github.sha }} "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ github.sha }}"

      - name: Show image digest
        run: |
          docker inspect --format='{{index .RepoDigests 0}}' \
            ghcr.io/ismaeel-20/ai381-mlops-lab2:${{ github.sha }}
